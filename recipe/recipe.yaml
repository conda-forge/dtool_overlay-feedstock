schema_version: 1

context:
  name: dtool_overlay
  version: "0.3.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/dtool-overlay/${{ name }}-${{ version }}.tar.gz
  sha256: 26d26049e2ac4fc340459892ed0d5f75a6a7817b3daea95dada49ac01aeab34e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools
  run:
    - click
    - dtool_cli
    - dtoolcore
    - parse
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - dtool_overlay
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  license: MIT
  license_file: LICENSE
  summary: dtool CLI utilities for working with per item metadata
  description: dtool CLI utilities for working with per item metadata
  homepage: https://github.com/jic-dtool/dtool-overlay
  repository: https://github.com/jic-dtool/dtool-overlay
  documentation: https://github.com/jic-dtool/dtool-overlay

extra:
  recipe-maintainers:
    - jan-janssen
    - tjelvar-olsson
